<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3f6f3">
    <title>FinTrack — нет подключения</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { display:grid; min-height:100vh; min-height:100dvh; margin:0; place-items:center; padding:24px; background:#f3f6f3; color:#17221d; }
      main { width:min(440px,100%); border:1px solid #dfe7e1; border-radius:26px; background:#fff; padding:30px; box-shadow:0 16px 44px rgba(27,52,39,.08); }
      .mark { display:grid; width:52px; height:52px; place-items:center; border-radius:16px 16px 16px 5px; background:#256a4a; color:#fff; font-size:24px; font-weight:800; }
      h1 { margin:24px 0 10px; font-size:32px; letter-spacing:-.04em; }
      p { color:#6d7872; line-height:1.6; }
      a { display:inline-flex; min-height:46px; align-items:center; border-radius:14px; margin-top:12px; padding:0 18px; background:#256a4a; color:#fff; font-weight:700; text-decoration:none; }
      @media (prefers-color-scheme:dark){ body{background:#101612;color:#edf4ef} main{border-color:#2d3931;background:#18201b} p{color:#a0aca4} }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">F</div>
      <h1>Вы офлайн</h1>
      <p>Основное приложение доступно без интернета после первой успешной загрузки. Вернитесь на главную или проверьте подключение.</p>
      <a href="./#/dashboard">Открыть FinTrack</a>
    </main>
  </body>
</html>
